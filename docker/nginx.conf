server {
  listen 80;
  root /usr/share/nginx/html;

  # Même origine que l'API : pas de CORS, et le cookie de session passe tel quel.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Fichiers à empreinte de Vite : jamais modifiés, donc mis en cache longtemps.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Historique HTML5 du routeur : toute autre route sert l'application.
  location / {
    try_files $uri /index.html;
  }
}
